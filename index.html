<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時間與馬表 APP</title>
    <style>
        /* --- CSS 樣式區塊 --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2c3e50;
            margin: 0;
            padding: 2vw;
            color: #ecf0f1;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background: #34495e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            text-align: center;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        /* 標題與切換按鈕的排版 */
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #7f8c8d;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        
        h2 {
            font-size: clamp(18px, 4vw, 24px);
            margin: 0;
            color: #bdc3c7;
        }

        .toggle-btn {
            background-color: #8e44ad;
            padding: 8px 12px;
            font-size: clamp(12px, 2.5vw, 16px);
            min-height: auto;
            flex: 0 1 auto;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
        }
        .toggle-btn:hover { background-color: #9b59b6; }

        /* 日期顯示設計：字體稍微放大 */
        #dateDisplay {
            font-size: clamp(24px, 6vw, 40px);
            color: #ecf0f1;
            margin-bottom: 5px;
            font-weight: bold;
        }

        /* 時間字體：縮小最大值，防止在 iPhone 等手機上超出邊界 */
        #clock {
            font-size: clamp(40px, 12vw, 85px); 
            font-weight: bold;
            letter-spacing: 2px;
            margin: 10px 0;
            color: #f1c40f;
            font-family: 'Courier New', Courier, monospace;
        }

        /* 馬表字體設計 */
        #stopwatch {
            font-size: clamp(40px, 10vw, 80px); 
            font-weight: bold;
            letter-spacing: 2px;
            margin: 20px 0;
            color: #f1c40f;
            font-family: 'Courier New', Courier, monospace;
        }
        /* 將微秒的字體設為 0.7 倍 */
        .ms {
            font-size: 0.7em;
            color: #bdc3c7;
        }

        /* 按鈕設計 */
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        button {
            flex: 1 1 80px;
            padding: 15px 10px;
            border: none;
            border-radius: 8px;
            background-color: #3498db;
            color: white;
            cursor: pointer;
            font-size: clamp(16px, 3vw, 20px);
            font-weight: bold;
            transition: background 0.2s;
            min-height: 50px;
        }

        button:hover { background-color: #2980b9; }
        #startBtn { background-color: #2ecc71; }
        #startBtn:hover { background-color: #27ae60; }
        #resetBtn { background-color: #e74c3c; }
        #resetBtn:hover { background-color: #c0392b; }
        
        /* 計圈紀錄列表設計 */
        #laps {
            list-style-type: none;
            padding: 0;
            margin-top: 20px;
            max-height: 40vh;
            overflow-y: auto;
            text-align: left;
        }

        #laps li {
            background: #2c3e50;
            margin: 5px 0;
            padding: 15px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            border-left: 5px solid #3498db;
            font-size: clamp(16px, 3vw, 22px);
        }
    </style>
</head>
<body>

    <!-- 區塊一：時間與日期 -->
    <div class="container">
        <div class="header-area">
            <h2 id="timeStatus">📱 設備時間</h2>
            <button id="toggleTimeBtn" class="toggle-btn">切換網路時間</button>
        </div>
        <div id="dateDisplay">載入中...</div>
        <div id="clock">--:--:--</div>
    </div>

    <!-- 區塊二：馬表計時器 -->
    <div class="container">
        <h2>⏱️ 馬表計時器</h2>
        <div id="stopwatch">00:00:00.<span class="ms">000</span></div>
        <div class="btn-group">
            <button id="startBtn">開始</button>
            <button id="pauseBtn">暫停</button>
            <button id="lapBtn">計圈</button>
            <button id="resetBtn">重設</button>
        </div>
        <ul id="laps"></ul>
    </div>

    <script>
        /* --- JavaScript 邏輯區塊 --- */

        let useNetworkTime = false; 
        let networkTimeOffset = 0;  

        const timeStatus = document.getElementById('timeStatus');
        const toggleTimeBtn = document.getElementById('toggleTimeBtn');
        const dateDisplay = document.getElementById('dateDisplay');
        const clockDisplay = document.getElementById('clock');

        // 改用 GitHub API 取得標準時間，解決手機連線被阻擋的問題
        async function fetchNetworkTime() {
            toggleTimeBtn.textContent = "連線中...";
            try {
                // 發送輕量級的 HEAD 請求給 GitHub API
                const response = await fetch('https://api.github.com/', { method: 'HEAD' });
                if (!response.ok) throw new Error('網路回應錯誤');
                
                // 從回應標頭中取得標準時間
                const dateHeader = response.headers.get('date');
                if (!dateHeader) throw new Error('無法讀取時間標頭');

                const networkDate = new Date(dateHeader);
                const localDate = new Date();
                
                // 計算誤差
                networkTimeOffset = networkDate.getTime() - localDate.getTime();
                useNetworkTime = true;
                
                timeStatus.innerHTML = "🌐 網路標準時間";
                toggleTimeBtn.textContent = "切換設備時間";
                updateClockDisplay();
                
            } catch (error) {
                console.error("無法取得網路時間", error);
                alert("無法連線至網路時間伺服器，將繼續使用設備時間。");
                useNetworkTime = false;
                timeStatus.innerHTML = "📱 設備時間";
                toggleTimeBtn.textContent = "切換網路時間";
            }
        }

        toggleTimeBtn.addEventListener('click', () => {
            if (useNetworkTime) {
                useNetworkTime = false;
                timeStatus.innerHTML = "📱 設備時間";
                toggleTimeBtn.textContent = "切換網路時間";
                updateClockDisplay();
            } else {
                fetchNetworkTime();
            }
        });

        function updateClockDisplay() {
            const currentTime = useNetworkTime ? new Date(Date.now() + networkTimeOffset) : new Date();
            
            const dateString = currentTime.toLocaleDateString('zh-TW', { 
                year: 'numeric', month: '2-digit', day: '2-digit'
            });
            dateDisplay.textContent = dateString;

            const timeString = currentTime.toLocaleTimeString('zh-TW', { 
                hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
            });
            clockDisplay.textContent = timeString;
        }

        setInterval(updateClockDisplay, 100);
        updateClockDisplay(); 

        // ==========================================
        // 馬表計時器邏輯
        // ==========================================
        let startTime = 0;      
        let elapsedTime = 0;    
        let timerInterval;      
        let isRunning = false;  
        let lapCount = 1;       

        const stopwatchDisplay = document.getElementById('stopwatch');
        const lapsList = document.getElementById('laps');

        function formatStopwatchTime(time) {
            const date = new Date(time);
            const minutes = String(date.getUTCMinutes()).padStart(2, '0');
            const seconds = String(date.getUTCSeconds()).padStart(2, '0');
            const milliseconds = String(date.getUTCMilliseconds()).padStart(3, '0');
            return `${minutes}:${seconds}.<span class="ms">${milliseconds}</span>`;
        }

        function updateStopwatch() {
            const currentTime = Date.now();
            const timeToDisplay = elapsedTime + (currentTime - startTime);
            stopwatchDisplay.innerHTML = formatStopwatchTime(timeToDisplay);
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            if (!isRunning) {
                startTime = Date.now();
                timerInterval = setInterval(updateStopwatch, 10);
                isRunning = true;
            }
        });

        document.getElementById('pauseBtn').addEventListener('click', () => {
            if (isRunning) {
                clearInterval(timerInterval);
                elapsedTime += Date.now() - startTime;
                isRunning = false;
            }
        });

        document.getElementById('lapBtn').addEventListener('click', () => {
            if (isRunning) {
                const currentTotalTime = elapsedTime + (Date.now() - startTime);
                const li = document.createElement('li');
                li.innerHTML = `<span>第 ${lapCount} 圈</span> <span>${formatStopwatchTime(currentTotalTime)}</span>`;
                lapsList.prepend(li);
                lapCount++;
            }
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            clearInterval(timerInterval);
            isRunning = false;
            elapsedTime = 0;
            lapCount = 1;
            stopwatchDisplay.innerHTML = `00:00:00.<span class="ms">000</span>`;
            lapsList.innerHTML = ""; 
        });
    </script>
</body>
</html>
