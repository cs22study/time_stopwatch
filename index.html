<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精準網路時間與馬表 APP</title>
    <style>
        /* --- CSS 樣式區塊：響應式設計與大字體 --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2c3e50; /* 改用深色背景，讓亮色數字更明顯 */
            margin: 0;
            padding: 2vw; /* 使用視窗寬度比例做內距 */
            color: #ecf0f1;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background: #34495e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            text-align: center;
            width: 100%;
            max-width: 600px; /* 限制最大寬度，在平板/電腦上才不會太寬 */
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        h2 {
            font-size: clamp(20px, 4vw, 28px); /* 標題隨螢幕縮放 */
            margin-top: 0;
            color: #bdc3c7;
            border-bottom: 2px solid #7f8c8d;
            padding-bottom: 10px;
        }

        /* 重點：時間與馬表的超大數字設計 */
        #clock, #stopwatch {
            /* clamp(最小值, 建議值, 最大值) - 讓字體在手機平板自動縮放 */
            font-size: clamp(40px, 10vw, 80px); 
            font-weight: bold;
            letter-spacing: 2px;
            margin: 20px 0;
            color: #f1c40f; /* 使用黃色讓數字更醒目 */
            font-family: 'Courier New', Courier, monospace; /* 使用等寬字體，數字跳動時才不會左右晃動 */
        }

        /* 適合手機點擊的大按鈕設計 */
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        button {
            flex: 1 1 80px; /* 讓按鈕在小螢幕時自動延展 */
            padding: 15px 10px;
            border: none;
            border-radius: 8px;
            background-color: #3498db;
            color: white;
            cursor: pointer;
            font-size: clamp(16px, 3vw, 20px);
            font-weight: bold;
            transition: background 0.2s;
            min-height: 50px; /* 確保符合手機觸控最小範圍標準 */
        }

        button:hover { background-color: #2980b9; }
        #startBtn { background-color: #2ecc71; }
        #startBtn:hover { background-color: #27ae60; }
        #resetBtn { background-color: #e74c3c; }
        #resetBtn:hover { background-color: #c0392b; }
        
        /* 計圈紀錄列表設計 */
        #laps {
            list-style-type: none;
            padding: 0;
            margin-top: 20px;
            max-height: 40vh; /* 最高佔螢幕 40%，超過可捲動 */
            overflow-y: auto;
            text-align: left;
        }

        #laps li {
            background: #2c3e50;
            margin: 5px 0;
            padding: 15px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            border-left: 5px solid #3498db;
            font-size: clamp(16px, 3vw, 22px);
        }
    </style>
</head>
<body>

    <!-- 區塊一：網路即時時間 -->
    <div class="container">
        <h2>🌐 網路標準時間</h2>
        <div id="clock">連線校時中...</div>
    </div>

    <!-- 區塊二：馬表計時器 -->
    <div class="container">
        <h2>⏱️ 馬表計時器</h2>
        <div id="stopwatch">00:00:00.000</div>
        <div class="btn-group">
            <button id="startBtn">開始</button>
            <button id="pauseBtn">暫停</button>
            <button id="lapBtn">計圈</button>
            <button id="resetBtn">重設</button>
        </div>
        <ul id="laps"></ul>
    </div>

    <script>
        /* --- JavaScript 邏輯區塊 --- */

        // ==========================================
        // 1. 網路時間校正與顯示邏輯
        // ==========================================
        let syncedTime = null; // 儲存從網路抓取到的時間物件

        // 非同步函數：呼叫外部 API 取得台北標準時間
        async function fetchNetworkTime() {
            try {
                // 使用 WorldTimeAPI 取得台北時區的時間
                const response = await fetch('https://worldtimeapi.org/api/timezone/Asia/Taipei');
                if (!response.ok) throw new Error('網路回應錯誤');
                
                const data = await response.json();
                // 將 API 回傳的 ISO 格式時間字串轉換為 Date 物件
                syncedTime = new Date(data.datetime);
                updateClockDisplay(); // 取得後立刻更新畫面
                
            } catch (error) {
                console.error("無法取得網路時間，將暫時使用系統時間", error);
                document.getElementById('clock').innerHTML = "時間同步失敗<br><span style='font-size:20px'>改用裝置時間</span>";
                syncedTime = new Date(); // 若 API 失敗（例如沒網路），作為備案使用本機時間
            }
        }

        // 更新畫面上的時鐘
        function updateClockDisplay() {
            if (!syncedTime) return; // 如果還沒抓到時間，先不執行
            
            // 格式化為 HH:MM:SS 格式 (24小時制)
            const timeString = syncedTime.toLocaleString('zh-TW', { 
                hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
            });
            document.getElementById('clock').textContent = timeString;
        }

        // 網頁載入時，先執行一次抓取網路時間
        fetchNetworkTime();

        // 設定每 1000 毫秒 (1秒) 讓時間自動往前推進 1 秒
        setInterval(() => {
            if (syncedTime) {
                // 將我們儲存的時間變數加 1 秒，而不是重新叫 API
                syncedTime.setSeconds(syncedTime.getSeconds() + 1);
                updateClockDisplay();
            }
        }, 1000);


        // ==========================================
        // 2. 馬表計時器邏輯
        // ==========================================
        let startTime = 0;      
        let elapsedTime = 0;    
        let timerInterval;      
        let isRunning = false;  
        let lapCount = 1;       

        const stopwatchDisplay = document.getElementById('stopwatch');
        const lapsList = document.getElementById('laps');

        function formatStopwatchTime(time) {
            const date = new Date(time);
            const minutes = String(date.getUTCMinutes()).padStart(2, '0');
            const seconds = String(date.getUTCSeconds()).padStart(2, '0');
            const milliseconds = String(date.getUTCMilliseconds()).padStart(3, '0');
            return `${minutes}:${seconds}.${milliseconds}`;
        }

        function updateStopwatch() {
            const currentTime = Date.now();
            const timeToDisplay = elapsedTime + (currentTime - startTime);
            stopwatchDisplay.textContent = formatStopwatchTime(timeToDisplay);
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            if (!isRunning) {
                startTime = Date.now();
                timerInterval = setInterval(updateStopwatch, 10);
                isRunning = true;
            }
        });

        document.getElementById('pauseBtn').addEventListener('click', () => {
            if (isRunning) {
                clearInterval(timerInterval);
                elapsedTime += Date.now() - startTime;
                isRunning = false;
            }
        });

        document.getElementById('lapBtn').addEventListener('click', () => {
            if (isRunning) {
                const currentTotalTime = elapsedTime + (Date.now() - startTime);
                const li = document.createElement('li');
                li.innerHTML = `<span>第 ${lapCount} 圈</span> <span>${formatStopwatchTime(currentTotalTime)}</span>`;
                lapsList.prepend(li);
                lapCount++;
            }
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            clearInterval(timerInterval);
            isRunning = false;
            elapsedTime = 0;
            lapCount = 1;
            stopwatchDisplay.textContent = "00:00:00.000";
            lapsList.innerHTML = ""; 
        });
    </script>
</body>
</html>
